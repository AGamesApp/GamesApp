# Nginx Configuration for AGames - Hetzner CPX22 (3 vCPU, 4GB RAM)
# =====================================================================
# Performance optimized for 100-150 concurrent connections
# Memory footprint: ~50MB

user www-data;
worker_processes 3;  # Match CPU cores
worker_rlimit_nofile 8192;
pid /run/nginx.pid;

events {
    worker_connections 768;  # 3 workers × 768 = 2304 max connections
    use epoll;  # Efficient for Linux
    multi_accept on;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;  # Reduced for 4GB RAM
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes (reduced for 4GB RAM)
    client_body_buffer_size 64k;
    client_max_body_size 50M;  # For game uploads
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;  # Balanced compression
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml;
    gzip_disable "msie6";

    ##
    # Rate Limiting (protect from abuse)
    ##
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    ##
    # Upstream Gunicorn
    ##
    upstream django {
        server 127.0.0.1:8000;
        keepalive 32;  # Keep connections to Gunicorn
    }

    ##
    # Server Block
    ##
    server {
        listen 80;
        server_name _;  # Replace with your domain

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Serve static files directly
        location /static/ {
            alias /var/www/agames/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Serve media files directly
        location /media/ {
            alias /var/www/agames/media/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Auth endpoints with stricter rate limiting
        location ~ ^/api/(auth|users)/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit 5;
            
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Admin panel
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Health check endpoint (no rate limiting)
        location /health/ {
            access_log off;
            proxy_pass http://django;
            proxy_set_header Host $host;
        }

        # Root
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
