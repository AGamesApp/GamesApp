# Redis 7.x Configuration for AGames - Hetzner CPX22 (3 vCPU, 4GB RAM)
# ========================================================================
# Memory allocation: ~256MB for Redis
# Target: Caching layer for Django
#
# Installation instructions:
# sudo nano /etc/redis/redis.conf
# Copy relevant settings below

# NETWORK
#------------------------------------------------------------------------------
bind 127.0.0.1 ::1                      # Only local connections
protected-mode yes
port 6379
tcp-backlog 511

# Connection limits
timeout 300                             # Close idle clients after 5 minutes
tcp-keepalive 300
maxclients 100                          # Match Django max connections

# GENERAL
#------------------------------------------------------------------------------
daemonize yes
supervised systemd
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log

# MEMORY MANAGEMENT (Critical for 4GB server)
#------------------------------------------------------------------------------
maxmemory 256mb                         # Limit Redis memory
maxmemory-policy allkeys-lru            # Evict least recently used keys
maxmemory-samples 5                     # LRU sample size

# Disable RDB persistence (use AOF only for data safety)
save ""

# APPEND ONLY FILE (AOF) - Recommended for production
#------------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec                    # Balance between safety and performance
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# SLOW LOG (Debug performance issues)
#------------------------------------------------------------------------------
slowlog-log-slower-than 10000           # Log queries slower than 10ms
slowlog-max-len 128

# LATENCY MONITOR
#------------------------------------------------------------------------------
latency-monitor-threshold 100           # Log events slower than 100ms

# ADVANCED CONFIG
#------------------------------------------------------------------------------
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Active memory defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75

# SECURITY
#------------------------------------------------------------------------------
# Uncomment and set a strong password in production
# requirepass your_strong_password_here

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_a8f5d3e2"  # Obfuscate CONFIG command

# PERFORMANCE NOTES
#------------------------------------------------------------------------------
# 1. After editing, restart Redis:
#    sudo systemctl restart redis-server
#
# 2. Verify settings:
#    redis-cli INFO memory
#    redis-cli CONFIG GET maxmemory
#
# 3. Monitor performance:
#    redis-cli --stat
#    redis-cli SLOWLOG GET 10
#
# 4. Check memory usage:
#    redis-cli INFO stats
#    redis-cli MEMORY STATS
#
# 5. Clear cache if needed:
#    redis-cli FLUSHDB  # Only if renamed command is enabled
