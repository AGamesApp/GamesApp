# PostgreSQL 14 Configuration for AGames - Hetzner CPX22 (3 vCPU, 4GB RAM)
# ===========================================================================
# Memory allocation: ~1.2GB for PostgreSQL
# Target: 100-150 concurrent connections
#
# Installation instructions:
# sudo nano /etc/postgresql/14/main/postgresql.conf
# Copy relevant settings below

# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------
max_connections = 100                   # Reduced for 4GB RAM (default: 100)
superuser_reserved_connections = 3      # Reserve for admin

# RESOURCE USAGE (Memory) - Critical for 4GB RAM
#------------------------------------------------------------------------------
shared_buffers = 1GB                    # 25% of RAM (4GB × 0.25)
effective_cache_size = 3GB              # 75% of RAM (4GB × 0.75)
maintenance_work_mem = 256MB            # For VACUUM, CREATE INDEX
work_mem = 10MB                         # Per operation (100 connections × 10MB = 1GB max)

# Memory for complex queries
temp_buffers = 8MB                      # Per session temp table
wal_buffers = 16MB                      # Write-ahead log buffer

# WRITE AHEAD LOG
#------------------------------------------------------------------------------
wal_level = replica                     # For replication support
max_wal_size = 1GB                      # Checkpoint trigger
min_wal_size = 80MB
checkpoint_completion_target = 0.9      # Spread checkpoint I/O

# QUERY TUNING
#------------------------------------------------------------------------------
random_page_cost = 1.1                  # SSD optimization (default: 4.0)
effective_io_concurrency = 200          # SSD can handle many concurrent I/O
default_statistics_target = 100         # Query planner statistics

# Parallel query settings (3 vCPU)
max_worker_processes = 3                # Match CPU cores
max_parallel_workers_per_gather = 2     # Per query
max_parallel_workers = 3                # Total parallel workers

# LOGGING
#------------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000       # Log slow queries (>1s)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off                   # Set 'on' for debugging
log_disconnections = off
log_lock_waits = on                     # Log lock waits
log_temp_files = 0                      # Log temp file usage

# AUTOVACUUM (Important for performance)
#------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3              # Match CPU cores
autovacuum_naptime = 1min               # Frequency
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1

# CLIENT CONNECTION DEFAULTS
#------------------------------------------------------------------------------
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# LOCK MANAGEMENT
#------------------------------------------------------------------------------
deadlock_timeout = 1s
max_locks_per_transaction = 64

# PERFORMANCE TUNING NOTES
#------------------------------------------------------------------------------
# 1. After editing, restart PostgreSQL:
#    sudo systemctl restart postgresql
#
# 2. Verify settings:
#    psql -U postgres -c "SHOW shared_buffers;"
#    psql -U postgres -c "SHOW effective_cache_size;"
#
# 3. Monitor performance:
#    SELECT * FROM pg_stat_activity;
#    SELECT * FROM pg_stat_database;
#
# 4. Vacuum regularly (handled by autovacuum):
#    VACUUM ANALYZE;
#
# 5. Check slow queries:
#    tail -f /var/log/postgresql/postgresql-*.log
