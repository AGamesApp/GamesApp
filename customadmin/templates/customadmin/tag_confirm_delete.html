{% extends 'customadmin/base.html' %}

{% block title %}Delete Tag{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Delete Tag</h1>
    <div class="page-actions">
        <a href="{% url 'customadmin:tag_list' %}" class="btn btn-secondary">← Back to List</a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="delete-confirmation">
            <div class="warning-icon">⚠️</div>
            <h2>Are you sure you want to delete this tag?</h2>
            <div class="delete-info">
                <p><strong>Tag:</strong> {{ object.name }}</p>
                <p class="warning-text">This action cannot be undone!</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="form-actions">
                    <button type="submit" class="btn btn-danger">
                        🗑️ Yes, Delete Tag
                    </button>
                    <a href="{% url 'customadmin:tag_list' %}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .delete-confirmation {
        text-align: center;
        padding: 2rem;
    }
    
    .warning-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
    }
    
    .delete-confirmation h2 {
        color: var(--danger);
        margin-bottom: 1.5rem;
    }
    
    .delete-info {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 10px;
        padding: 1.5rem;
        margin: 2rem 0;
    }
    
    .delete-info p {
        margin: 0.5rem 0;
        color: var(--text-primary);
    }
    
    .warning-text {
        color: var(--danger);
        font-weight: 600;
        margin-top: 1rem !important;
    }
</style>
{% endblock %}
